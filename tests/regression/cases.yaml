      temperature_end_k: 302.0
      mixing_ratio_start_kg_kg: 0.008
      mixing_ratio_end_kg_kg: 0.004
      vertical_levels_stag: 5
    fuel:
      categories:
      - 7
      - 3
      - 6
      - 5
      - 1
      - 13
      - 2
      - 12
      - 10
      - 11
      - 9
      - 8
      strip_axis: south_north
    terrain:
      kind: sinusoidal
      base_elevation_m: 1600.0
      amplitude_m: 150.0
      wavelength_x_m: 6000.0
      wavelength_y_m: 6000.0
    ignition:
      kind: perimeter
      radius_m: 500.0
      count: 1
      start_time_s: 8.0
    moisture:
      run: true
      frequency_timesteps: 1
      dt_seconds: 4.0
    interpolation:
      horizontal: 2
      vertical: 0
      fire_wind_height_m: 20.0
