        - mpi1
        - mpi4
        - hybrid4
      fuels:
        configurations:
        - base
        executions:
        - serial
        - omp1
        - omp4
        - mpi1
        - mpi4
        - hybrid4
      terrain:
        configurations:
        - u10m
        - u3d
        executions:
        - serial
        - omp1
        - omp4
        - mpi1
        - mpi4
        - hybrid4
  full:
