# Scientific defaults and named cases. Execution settings cannot override science.
defaults:
  time:
    start: 2020-01-01_00:00:00
    duration_seconds: 60
    dt_seconds: 4
    output_interval_seconds: 60
    atmosphere_interval_seconds: 4
  grid:
    nx: 72
    ny: 72
    dx_m: 100.0
    dy_m: 100.0
    sr_x: 1
    sr_y: 1
    axis_order: NetCDF (Time,south_north,west_east); Fortran (west_east,south_north)
  projection:
    cen_lat: 40.0
    cen_lon: -105.0
    stand_lon: -105.0
    true_lat_1: 30.0
    true_lat_2: 60.0
    map_proj: 1
  forcing:
    u10_m_s: 0.0
    v10_m_s: 0.0
    temperature_start_k: 300.0
    temperature_end_k: 300.0
    mixing_ratio_start_kg_kg: 0.006
    mixing_ratio_end_kg_kg: 0.006
    surface_pressure_pa: 90000.0
    accumulated_rain_start_mm: 0.0
    accumulated_rain_end_mm: 0.0
    vertical_levels_stag: 5
    roughness_length_min_m: 0.05
    roughness_length_max_m: 0.25
    height_interfaces_m:
    - 0.0
    - 20.0
    - 60.0
    - 120.0
    - 200.0
    u_profile_m_s:
    - 10.0
    - 14.0
    - 18.0
    - 22.0
    v_profile_m_s:
    - 10.0
    - 6.0
    - 2.0
    - -2.0
  fuel:
    family: Anderson13
    family_id: 1
    uniform_category: 3
    categories:
    - 3
    strip_axis: south_north
  terrain:
    kind: flat
    base_elevation_m: 1600.0
    amplitude_m: 0.0
    wavelength_x_m: 6000.0
    wavelength_y_m: 6000.0
    ideal_dz_dx: 0.0
    ideal_dz_dy: 0.0
  ignition:
    kind: point
    count: 1
    center_x_fraction: 0.5
    center_y_fraction: 0.5
    line_x_fraction: 0.35
    line_y_start_fraction: 0.25
    line_y_end_fraction: 0.75
    radius_m: 500.0
    ros_m_s: 250.0
    start_time_s: 0.0
    end_time_s: 2.0
    start_lat: 40.0
    start_lon: -105.0
    end_lat: 40.0
    end_lon: -105.0
  moisture:
    run: false
    frequency_timesteps: 0
    dt_seconds: 600.0
    initial_dead: 0.08
    initial_live: 0.3
    model_id: -1
  interpolation:
    horizontal: 2
    vertical: 1
    fire_wind_height_m: 6.096
  model:
    ideal_opt: 1
    devel_opt: 1
    fire_lsm_reinit: true
    reinit_pseudot_coef: 0.0001
    num_tiles: 4
    tile_strategy: 3
  output:
    level: 0
    check_isolated_neg_lfn: 2
cases:
  circle_nowind:
