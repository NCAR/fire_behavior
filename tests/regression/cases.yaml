    cases:
      circle:
        configurations:
        - base
        - godunov
        executions:
        - serial
        - omp1
        - omp4
        - mpi1
        - mpi4
        - mpi8
        - hybrid4
      fuels:
        configurations:
        - base
        - godunov
        executions:
        - serial
        - omp1
        - omp4
        - mpi1
        - mpi4
        - mpi8
        - hybrid4
      terrain:
        configurations:
        - u10m
        - u3d
        - godunov10m
        - godunov3d
        executions:
        - serial
        - omp1
        - omp4
        - mpi1
        - mpi4
        - mpi8
        - hybrid4
