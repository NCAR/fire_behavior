name: Fire Behavior CI Test

on:
  schedule:
    - cron: '0 10 * * 4'
  push:
    branches: [ main, develop ]
  # Test prerequisite branches before anything is merged into develop.
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      create_reference:
        description: 'Generate an unapproved PR-suite reference for review'
        type: boolean
        default: false

env:
  # Normal PR checks require this committed reference. Candidate generation is
  # manual and never approves or activates the generated files.
  CFBM_CI_REFERENCE: tests/regression/baselines/github-pr-hybrid
  openmpi-url: 'https://download.open-mpi.org/release/open-mpi/v4.0/openmpi-4.0.3.tar.gz'
  hdf5-url: 'https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.12/hdf5-1.12.2/src/hdf5-1.12.2.tar.gz'
  netcdf-url: 'https://github.com/Unidata/netcdf-c/archive/v4.9.0.tar.gz'
  netcdff-url: 'https://github.com/Unidata/netcdf-fortran/archive/v4.5.4.tar.gz'
  esmf-url: 'https://github.com/esmf-org/esmf/archive/refs/tags/v8.5.0.tar.gz'

jobs:
  python_format:
    name: Python formatting
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install the pinned formatter
      run: python -m pip install -r tests/regression/requirements-style.txt
    - name: Check harness formatting without changing files
      run: python -m yapf --diff --recursive --style tests/regression/.style.yapf tests/regression

  fire_behavior_linux_test:
    name: New regression harness
    strategy:
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{matrix.os}}
    env:
      # The four-rank CTest also needs oversubscription on smaller CI runners.
      OMPI_MCA_rmaps_base_oversubscribe: '1'
      CTEST_OUTPUT_ON_FAILURE: '1'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Require the approved baseline for normal checks
      if: ${{ !inputs.create_reference }}
      run: test -f "$CFBM_CI_REFERENCE/reference.json"
    - name: Cache Dependencies
      id: cache-build-dependencies
      uses: actions/cache@v4
      env:
        cache-name: cache-build-dependencies
      with:
        path: "~/stack"
        key: ${{env.cache-name}}-${{matrix.os}}
        restore-keys: |
          ${{env.cache-name}}-${{matrix.os}}
    - name: Dependency Directory Setup
      run: |
        export STACK_DIR=${HOME}/stack
        mkdir -p ${STACK_DIR}/{include,lib,lib64,bin}
        export LD_LIBRARY_PATH=${STACK_DIR}/lib64:${STACK_DIR}/lib:${LD_LIBRARY_PATH}
        echo "STACK_DIR=${STACK_DIR}" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV
        echo "${STACK_DIR}/bin" >> $GITHUB_PATH
    - name: Install OPENMPI
      env:
        CACHE_HIT: ${{steps.cache-build-dependencies.outputs.cache-hit}}
      run: |
        if [[ "$CACHE_HIT" != 'true' ]]; then
          mkdir ${{runner.temp}}/openmpi
          cd ${{runner.temp}}/openmpi
          curl -L ${{env.openmpi-url}} | tar --strip-components=1 -xz
          ./configure --quiet --enable-silent-rules --prefix=${{env.STACK_DIR}}
          make -j 2 install
        fi
        echo "CC=${{env.STACK_DIR}}/bin/mpicc" >> $GITHUB_ENV
        echo "CXX=${{env.STACK_DIR}}/bin/mpicxx" >> $GITHUB_ENV
        echo "F77=${{env.STACK_DIR}}/bin/mpif77" >> $GITHUB_ENV
        echo "F90=${{env.STACK_DIR}}/bin/mpif90" >> $GITHUB_ENV
        echo "FC=${{env.STACK_DIR}}/bin/mpifort" >> $GITHUB_ENV
        echo "OPENMPI_ROOT=$STACK_DIR" >> $GITHUB_ENV
    - name: Install HDF5
      env:
        CACHE_HIT: ${{steps.cache-build-dependencies.outputs.cache-hit}}
      run: |
        if [[ "$CACHE_HIT" != 'true' ]]; then
          mkdir ${{runner.temp}}/hdf5
          cd ${{runner.temp}}/hdf5
          curl -L ${{env.hdf5-url}} | tar --strip-components=2 -xz
          ./configure --quiet --enable-silent-rules --enable-fortran --prefix=${{env.STACK_DIR}}
          make -j 2 install
        fi
        echo "HDF5_ROOT=$STACK_DIR" >> $GITHUB_ENV
    - name: Install NetCDF-C
      env:
        CACHE_HIT: ${{steps.cache-build-dependencies.outputs.cache-hit}}
      run: |
        if [[ "$CACHE_HIT" != 'true' ]]; then
          mkdir ${{runner.temp}}/netcdf-c
          cd ${{runner.temp}}/netcdf-c
          curl -L ${{env.netcdf-url}} | tar --strip-components=1 -xz
          CPPFLAGS=-I${STACK_DIR}/include LDFLAGS=-L${STACK_DIR}/lib ./configure --quiet --enable-silent-rules --prefix=${{env.STACK_DIR}}
          make -j 2 install
        fi
        echo "NETCDF_ROOT=$STACK_DIR" >> $GITHUB_ENV
    - name: Install NetCDF-Fortran
      env:
        CACHE_HIT: ${{steps.cache-build-dependencies.outputs.cache-hit}}
      run: |
        if [[ "$CACHE_HIT" != 'true' ]]; then
          mkdir ${{runner.temp}}/netcdf-fortran
          cd ${{runner.temp}}/netcdf-fortran
          curl -L ${{env.netcdff-url}} | tar --strip-components=1 -xz
          CPPFLAGS=-I${STACK_DIR}/include LDFLAGS=-L${STACK_DIR}/lib ./configure --quiet --enable-silent-rules --prefix=${{env.STACK_DIR}}
          make -j 2 install
        fi
        echo "NETCDFF_ROOT=$STACK_DIR" >> $GITHUB_ENV
    - name: Install ESMF
      env:
        CACHE_HIT: ${{steps.cache-build-dependencies.outputs.cache-hit}}
        ESMF_COMM: "openmpi"
        ESMF_BOPT: "O"
        ESMF_COMPILER: "gfortran"
        ESMF_OS: "Linux"
        ESMF_NETCDF: "nc-config"
        ESMF_INSTALL_MODDIR: "mod"
        ESMF_INSTALL_BINDIR: "bin"
        ESMF_INSTALL_LIBDIR: "lib"
        ESMF_INSTALL_PREFIX: "${STACK_DIR}"
      run: |
        if [[ "$CACHE_HIT" != 'true' ]]; then
          mkdir ${{runner.temp}}/esmf
          cd ${{runner.temp}}/esmf
          export ESMF_DIR=`pwd`
          curl -L ${{env.esmf-url}} | tar --strip-components=1 -xz
          make -j 2
          make install
        fi
        echo "ESMFMKFILE=$STACK_DIR/lib/esmf.mk" >> $GITHUB_ENV
        echo "ESMF_ROOT=$STACK_DIR" >> $GITHUB_ENV
    - name: Set up regression Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install regression dependencies
      run: python -m pip install -r tests/regression/requirements.txt
    - name: Build each executable configuration once
      env:
        CREATE_REFERENCE: ${{ inputs.create_reference }}
      run: |
        for variant in serial omp mpi hybrid; do
          OPTIONS=()
          case "$variant" in
            serial) OPTIONS+=(--mpi-off) ;;
            omp) OPTIONS+=(--mpi-off --openmp-on) ;;
            mpi) OPTIONS+=(--esmx) ;;
            hybrid) OPTIONS+=(--openmp-on --esmx) ;;
          esac
          # Strict uses the bundled reference unless generating a new candidate.
          if [[ "$CREATE_REFERENCE" == true ]]; then
            OPTIONS+=(--no-reference)
          fi
          ./compile.sh --build-type=Strict "${OPTIONS[@]}" \
            --build-dir="$GITHUB_WORKSPACE/build/$variant" \
            --prefix="$GITHUB_WORKSPACE/install/$variant"
        done
    - name: Run the selected CTest suite and compare executions
      run: |
        OPTIONS=()
        for variant in serial omp mpi hybrid; do
          OPTIONS+=(--build-dir "$GITHUB_WORKSPACE/build/$variant")
        done
        python -B tests/regression/regression.py suite "${OPTIONS[@]}" \
          --suite pr --run-root "$GITHUB_WORKSPACE/build/results"
    - name: Save an unapproved reference from the passing suite
      if: ${{ inputs.create_reference }}
      run: |
        # A fresh runner produces exactly one PR-suite directory.
        suites=("$GITHUB_WORKSPACE"/build/results/pr-*)
        test "${#suites[@]}" -eq 1
        python -B tests/regression/regression.py reference-create \
          --suite-root "${suites[0]}" \
          --destination "$GITHUB_WORKSPACE/build/candidate"
        {
          git rev-parse HEAD
          gfortran --version
          mpiexec --version
          nc-config --all
          python --version
          python -m pip freeze
          cat "$STACK_DIR/lib/esmf.mk"
        } > "$GITHUB_WORKSPACE/build/candidate/environment.txt"
        # NetCDF timestamps contain colons, which artifact upload rejects.
        tar -czf "$RUNNER_TEMP/baseline-candidate.tar.gz" -C build/candidate .
    - name: Upload the candidate for team review
      if: ${{ inputs.create_reference }}
      uses: actions/upload-artifact@v4
      with:
        name: baseline-candidate-${{ github.sha }}
        path: ${{ runner.temp }}/baseline-candidate.tar.gz
        if-no-files-found: error
    - name: Package test evidence with original NetCDF filenames
      if: ${{ !cancelled() }}
      run: |
        shopt -s nullglob
        files=(build/*/tests/Testing/Temporary/LastTest.log build/*/CMakeCache.txt)
        if [[ -d build/results ]]; then files+=(build/results); fi
        if (( ${#files[@]} )); then
          tar -czf "$RUNNER_TEMP/test-evidence.tar.gz" "${files[@]}"
        fi
    - name: Archive test evidence
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: fire-behavior-test-${{matrix.os}}
        path: ${{ runner.temp }}/test-evidence.tar.gz
